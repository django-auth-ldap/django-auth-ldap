[tox]
envlist =
    ruff
    docs
    django52
    django60
    django61
    djangomain
isolated_build = true

[gh]
python =
    3.10 = django{52}
    3.11 = django{52}
    3.12 = django{52,60,61,main}
    3.13 = django{52,60,61,main}
    3.14 = django{52,60,61,main}

[testenv]
commands =
    {envpython} -Wa -b -m django test --settings tests.settings
    {envpython} -Wa -b -m unittest discover --pattern *_test_without_django.py
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    djangomain: https://github.com/django/django/archive/main.tar.gz

[testenv:ruff]
deps = ruff
commands = ruff check .
skip_install = true
